# Keybindings reference for ~/.config/i3/help.sh ($mod+F1) -- "快捷鍵一覽".
# NOT sourced by i3 itself -- this is a curated cheat-sheet data file, kept
# in the same # -- SECTION -- # / "# description" + "key combo" shape as
# gh0stzk's sxhkdrc so help.sh's parser (ported from their Help script) can
# stay almost line-for-line the same. Keep this in sync by hand whenever a
# binding in ~/.config/i3/config changes -- there is no automatic link
# between the two files.

# -- Essentials -- #

# Open terminal
Super + Return

# App launcher
Super + d

# Toggle input method (English / Zhuyin)
Super + i

# Toggle input method (English / Zhuyin) -- tap alone, don't hold
Right Shift (tap)

# Window switcher (list all windows)
Super + Tab

# Clipboard history picker
Super + v

# Close focused window
Super + Shift + q

# Exit i3 (confirm)
Super + Shift + e

# Power menu (lock / theme / logout / suspend / reboot / shutdown)
Super + Shift + p

# -- Alt-Tab -- #

# Step back through recently-focused windows (MRU cycling)
Alt + Tab

# -- Focus Movement -- #

# Focus left / down / up / right
Super + h / j / k / l (or arrows)

# -- Move Windows -- #

# Move focused window left / down / up / right
Super + Shift + h / j / k / l (or arrows)

# -- Layout / Floating / Fullscreen -- #

# Stacking layout
Super + s

# Tabbed layout
Super + w

# Toggle split layout
Super + e

# Fullscreen toggle
Super + f

# Toggle maximize (below top bar) / restore (1920x1080)
Super + Shift + m (or Super + m)

# Toggle floating
Super + Shift + f

# Minimize to scratchpad
Super + Shift + Minus

# Restore from scratchpad
Super + Minus

# Toggle focus mode (tiling <-> floating)
Super + grave

# Focus parent container
Super + a

# -- Workspaces -- #

# Switch to workspace 1-10
Super + 1..0

# Move focused window to workspace 1-10
Super + Shift + 1..0

# -- i3 Control -- #

# Reload config
Super + Shift + c

# Restart i3 in place
Super + Shift + r

# Resize mode
Super + r

# Resize without entering a mode
Super + Ctrl + h / j / k / l (or arrows)

# -- Screenshot / Lock -- #

# Screenshot (region, interactive)
Print

# Screenshot (full screen)
Super + Print

# Screenshot (all screens)
Super + Shift + Print

# Screenshot (region, copy to clipboard)
Super + Shift + s

# Lock screen
Super + Shift + x

# -- Volume / Brightness / Media -- #

# Volume up / down / mute
XF86AudioRaiseVolume / LowerVolume / Mute

# Microphone mute
XF86AudioMicMute

# Brightness up / down
XF86MonBrightnessUp / Down

# Media play / pause / stop / next / previous
XF86AudioPlay / Pause / Stop / Next / Prev

# -- Desktop & Taskbar -- #

# Desktop (theme) selector
Alt + Space

# Taskbar (bar style) selector
Super + Shift + Space

# User card (quick info & actions)
Super + u

# Right-click the desktop background for a quick menu
Button3 (on empty desktop)

# Keybindings cheatsheet (this menu)
Alt + F1

# Wallpaper picker
Super + Shift + w

# Hide/show the taskbar (top bar + dock)
Super + Shift + u

# Restore a specific hidden/minimized window by name
Ctrl + Alt + h

# Soft reload (re-apply the rice, restart its daemons, no full i3 restart)
Ctrl + Alt + Super + s

# -- Network / Bluetooth -- #

# Network manager
Super + Shift + n

# Bluetooth manager
Super + Shift + b

# -- Window Transparency -- #

# Increase transparency on focused window
Ctrl + Alt + Shift + Plus (or Ctrl + Alt + =)

# Decrease transparency on focused window
Ctrl + Alt + Minus

# Reset transparency on focused window
Ctrl + Alt + t
