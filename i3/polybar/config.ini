; ============================================================================
; Polybar config -- styled after hcx05/ArchDotfiles (bar07 / bar01 / bar08)
; Colors come from ~/.config/polybar/colors.ini, generated from
; ~/.config/rice/theme.conf by ~/.config/rice/apply-theme.sh.
; ============================================================================

include-file = /home/kali/.config/polybar/colors.ini
include-file = /home/kali/.config/polybar/layout.ini

; ============================================================================
; bar/mainbar -- classic layout top bar (LAYOUT="classic")
; ============================================================================
[bar/mainbar]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font Propo:size=11.5;3"
font-2 = "JetBrainsMono Nerd Font Propo:size=13.5;3"
font-3 = "JetBrainsMono Nerd Font:size=15;4"
font-4 = "Droid Sans Fallback:size=9.5;2"

modules-left = launcher dots workspaces_pinned sep quicklaunch sep bi ricemenu barmenu wallpapermenu usercard helpmenu bd
modules-center = xwindow
modules-right = bi cpu pill_sep memory pill_sep filesystem bd sep bi vpn pill_sep netspeed pill_sep network bd sep bi pulseaudio bd sep bi ime bd sep bi date bd sep powermenu

separator =
cursor-click = pointer
enable-ipc = true

; ============================================================================
; bar/monobar -- floating island top bar (LAYOUT="dock")
; Narrower horizontal width (centered on screen like ArchDotfiles bar01/bar07)
; and slim 26px height, using rounded pills (...) and ArchDotfiles icons.
; ============================================================================
[bar/monobar]
monitor = ${env:MONITOR:}
width = ${layout.monobar-width}
height = ${layout.monobar-height}
offset-x = ${layout.monobar-offset-x}
offset-y = ${layout.monobar-offset-y}
radius = 8
fixed-center = true
override-redirect = true
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}

border-size = ${layout.monobar-border}
border-color = ${colors.border-active}
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font Propo:size=11.5;3"
font-2 = "JetBrainsMono Nerd Font Propo:size=13.5;3"
font-3 = "JetBrainsMono Nerd Font:size=15;4"
font-4 = "Droid Sans Fallback:size=9.5;2"

modules-left = launcher dots bi cpu bd sep bi memory bd sep bi filesystem bd dots bi ricemenu barmenu wallpapermenu usercard helpmenu bd
modules-center = workspaces_pinned
modules-right = bi vpn pill_sep netspeed pill_sep network bd sep bi pulseaudio battery bd sep bi ime bd sep bi date-mono bd sep power-mono

separator =
cursor-click = pointer
enable-ipc = true

; ============================================================================
; Pill caps & separators (hcx05/ArchDotfiles style)
; ============================================================================
[module/bi]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.background-alt}

[module/bd]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${colors.background-alt}

[module/sep]
type = custom/text
label = " "

[module/pill_sep]
type = custom/text
label = "  "
label-background = ${colors.background-alt}

[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 2
label-foreground = ${colors.foreground-alt}

; ============================================================================
; Modules
; ============================================================================
[module/launcher]
type = custom/text
format = <label>
label = "  "
label-font = 3
label-foreground = ${colors.accent}
click-left = rofi -show drun -config ~/.config/rofi/config.rasi &
click-right = /home/kali/.config/rice/rice-selector.sh &

[module/powermenu]
type = custom/text
format = <label>
label = "  "
label-font = 2
label-foreground = ${colors.urgent}
click-left = /home/kali/.config/rofi/scripts/powermenu.sh &

[module/power-mono]
type = custom/text
format = <label>
label = "  "
label-font = 2
label-foreground = ${colors.urgent}
click-left = /home/kali/.config/rofi/scripts/powermenu.sh &

; Desktop (theme) / taskbar (bar-style) / wallpaper / user-card / help --
; FIVE SEPARATE modules sharing one background color (with
; module-margin-left/right = 0 on both bars, so they sit flush and read as
; one pill), each using polybar's own ini-level click-left instead of a
; single custom/script module with 3+ inline %{A1:cmd:} blocks.
; NOT cosmetic: a single combined module (taskbar-actions.sh, kept in
; scripts/ for reference but no longer wired in here) was verified live to
; silently drop EVERY click once it carried 3 or more actions -- isolated
; down to exactly 2 fired correctly and 3 did not, independent of which
; scripts, their path, icon choice, or a unique-prefix workaround that by
; itself only fixed the 2-action case. Separate modules with ini
; click-left never showed this (each module's action is registered
; through its own normal ini binding, not through runtime text parsing),
; so that's the reliable form here even though it costs five [module/...]
; blocks instead of one.
[module/ricemenu]
type = custom/text
format = <label>
label = " 󰏘 "
label-font = 3
label-background = ${colors.background-alt}
label-foreground = ${colors.accent}
click-left = /home/kali/.config/rice/rice-selector.sh &

[module/barmenu]
type = custom/text
format = <label>
label = " 󰕰 "
label-font = 3
label-background = ${colors.background-alt}
label-foreground = ${colors.accent-alt}
click-left = /home/kali/.config/rice/bar-selector.sh &

[module/wallpapermenu]
type = custom/text
format = <label>
label = " 󰸉 "
label-font = 3
label-background = ${colors.background-alt}
label-foreground = ${colors.foreground}
click-left = /home/kali/.config/rice/wallpaper-selector.sh &

[module/usercard]
type = custom/text
format = <label>
label = "  "
label-font = 3
label-background = ${colors.background-alt}
label-foreground = ${colors.accent-alt}
click-left = /home/kali/.config/rice/usercard.sh &

[module/helpmenu]
type = custom/text
format = <label>
label = "  "
label-font = 3
label-background = ${colors.background-alt}
label-foreground = ${colors.foreground-alt}
click-left = /home/kali/.config/i3/help.sh &

[module/workspaces_pinned]
type = custom/script
exec = /home/kali/.config/polybar/scripts/workspaces-pinned.sh
tail = true

[module/quicklaunch]
type = custom/script
exec = /home/kali/.config/polybar/scripts/quicklaunch.sh

[module/xwindow]
type = internal/xwindow
format = <label>
format-prefix = "%{A1:rofi -show window -config ~/.config/rofi/config.rasi &:}󱂬 %{A}"
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = "%{A1:rofi -show window -config ~/.config/rofi/config.rasi &:}%title:0:45:...%%{A}"
label-foreground = ${colors.foreground}
label-empty = "%{A1:rofi -show drun -config ~/.config/rofi/config.rasi &:}Kali Linux%{A}"
label-empty-foreground = ${colors.foreground-alt}

[module/netspeed]
type = custom/script
exec = /home/kali/.config/polybar/scripts/netspeed.sh
interval = 2
format = <label>
format-background = ${colors.background-alt}
label = %output%
label-foreground = ${colors.foreground}
click-left = /home/kali/.config/polybar/scripts/net-menu.sh &
click-right = /home/kali/.config/polybar/scripts/net-menu.sh &

[module/vpn]
type = custom/script
exec = /home/kali/.config/polybar/scripts/vpn.sh
interval = 5
format = <label>
format-background = ${colors.background-alt}
label = %output%
click-left = /home/kali/.config/polybar/scripts/net-menu.sh &
click-right = /home/kali/.config/polybar/scripts/net-menu.sh &

[module/network]
type = custom/script
exec = /home/kali/.config/polybar/scripts/network.sh
interval = 5
format = <label>
format-background = ${colors.background-alt}
label = %output%
click-left = /home/kali/.config/polybar/scripts/net-menu.sh &
click-right = /home/kali/.config/polybar/scripts/net-menu.sh &

[module/ime]
type = custom/script
exec = /home/kali/.config/polybar/scripts/ime.sh
interval = 1
format = <label>
format-background = ${colors.background-alt}
label = %output%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.background-alt}
format-prefix = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh cpu &:} %{A}"
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh cpu &:}%percentage%%%{A}"
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = ${colors.background-alt}
format-prefix = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh mem &:}󰍛 %{A}"
format-prefix-font = 2
format-prefix-foreground = ${colors.accent-alt}
label = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh mem &:}%percentage_used%%%{A}"
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-mounted-background = ${colors.background-alt}
format-mounted-prefix = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh disk &:} %{A}"
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = "%{A1:/home/kali/.config/polybar/scripts/sysinfo-menu.sh disk &:}%percentage_used%%%{A}"
label-mounted-foreground = ${colors.foreground}
label-unmounted =

[module/temperature]
type = internal/temperature
interval = 3
thermal-zone = 0
warn-temperature = 80
format = <label>
format-background = ${colors.background-alt}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.accent-alt}
format-warn = <label-warn>
format-warn-background = ${colors.background-alt}
format-warn-prefix = " "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.urgent}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/pulseaudio]
type = custom/script
exec = /home/kali/.config/polybar/scripts/volume.sh
interval = 1
format = <label>
format-background = ${colors.background-alt}
label = %output%
click-left = /home/kali/.config/polybar/scripts/audio-menu.sh &
click-right = /home/kali/.config/i3/osd.sh vol-mute &
scroll-up = /home/kali/.config/i3/osd.sh vol-up &
scroll-down = /home/kali/.config/i3/osd.sh vol-down &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-charging-background = ${colors.background-alt}
format-charging-prefix = "   "
format-charging-prefix-font = 2
format-charging-prefix-foreground = ${colors.accent}
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.background-alt}
format-full = <label-full>
format-full-background = ${colors.background-alt}
format-full-prefix = "   "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.accent}
format-low = <label-low>
format-low-background = ${colors.background-alt}
format-low-prefix = "   "
format-low-prefix-font = 2
format-low-prefix-foreground = ${colors.urgent}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
ramp-capacity-0 = "  "
ramp-capacity-1 = "  "
ramp-capacity-2 = "  "
ramp-capacity-3 = "  "
ramp-capacity-4 = "  "
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.accent-alt}

[module/date]
type = internal/date
interval = 1
date = "%b %d"
time = "%H:%M"
format = <label>
format-background = ${colors.background-alt}
format-prefix = "%{A1:/home/kali/.config/polybar/scripts/calendar.sh &:} %{A}"
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = "%{A1:/home/kali/.config/polybar/scripts/calendar.sh &:}%date%  %time%%{A}"
label-foreground = ${colors.foreground}

[module/date-mono]
type = internal/date
interval = 1
date = "%a, %d %b"
time = "%H:%M"
format = <label>
format-background = ${colors.background-alt}
format-prefix = "%{A1:/home/kali/.config/polybar/scripts/calendar.sh &:} %{A}"
format-prefix-font = 2
format-prefix-foreground = ${colors.accent}
label = "%{A1:/home/kali/.config/polybar/scripts/calendar.sh &:}%date%  %time%%{A}"
label-foreground = ${colors.foreground}
