; ============================================================================
; Polybar config -- futuristic system telemetry bar
; Colors come from ~/.config/polybar/colors.ini, generated from
; ~/.config/rice/theme.conf by ~/.config/rice/apply-theme.sh.
; This file is safe to hand-edit for modules/layout.
; ============================================================================

include-file = ~/.config/polybar/colors.ini

[bar/mainbar]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=12;4"

modules-left = powermenu launcher workspaces_pinned quicklaunch
modules-center = xwindow
modules-right = netspeed vpn cpu memory filesystem pulseaudio tray date

cursor-click = pointer
enable-ipc = true

separator = "  "

[module/powermenu]
type = custom/text
; nf-fa-power_off, verified against installed font cmap. Same no-%{T2}
; rule as the other bar icons (clipping risk at the larger font size).
format = <label>
label = "    "
label-foreground = ${colors.urgent}
label-background = ${colors.background-alt}
click-left = ~/.config/rofi/scripts/powermenu.sh &

[module/launcher]
type = custom/text
; nf-fa-th (apps grid icon), verified against installed font cmap.
; No %{T2} here -- same clipping risk the taskbar icons had (icon
; wider than the monospace glyph cell at the larger size gets
; right-clipped).
format = <label>
label = "    Apps  "
label-foreground = ${colors.background}
label-background = ${colors.accent}
click-left = rofi -show drun -config ~/.config/rofi/config.rasi &

[module/workspaces_pinned]
; Fixed, always-visible, independently-clickable buttons for workspaces
; 1-4 -- unlike internal/i3 (which mirrors i3's live workspace list and
; loses empty/unfocused workspaces since i3 auto-destroys them), these
; always show and always work as click targets. Script handles its own
; highlight-the-focused-one logic and live-updates via `i3-msg -t subscribe`.
; Workspaces 5+ are still reachable via Super+5..0, just not pinned here --
; ask if you want more of them pinned too.
type = custom/script
exec = ~/.config/polybar/scripts/workspaces-pinned.sh
tail = true

[module/quicklaunch]
; Pinned quick-launch dock (browser/terminal/Burp/...). Static list, edit
; the APPS array in scripts/quicklaunch.sh to pin more -- no live updates
; needed so this just runs once.
type = custom/script
exec = ~/.config/polybar/scripts/quicklaunch.sh

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.foreground-alt}

[module/netspeed]
type = custom/script
exec = ~/.config/polybar/scripts/netspeed.sh
interval = 2
label = %output%
label-foreground = ${colors.foreground}

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 5
label = %output%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage_used%%
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted = " %percentage_used%%"
label-mounted-foreground = ${colors.foreground}
label-unmounted =

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = " muted"
label-muted-foreground = ${colors.foreground-alt}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol

[module/tray]
type = internal/tray
tray-spacing = 24px
tray-size = 66%
tray-background = ${colors.background}

[module/date]
type = internal/date
interval = 1
date = " %Y-%m-%d"
time = "  %H:%M:%S"
label = %date%  %time%
label-foreground = ${colors.accent}
