; ============================================================================
; Polybar config -- futuristic system telemetry bar
; Colors come from ~/.config/polybar/colors.ini, generated from
; ~/.config/rice/theme.conf by ~/.config/rice/apply-theme.sh.
; This file is safe to hand-edit for modules/layout.
; ============================================================================

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/layout.ini

[bar/mainbar]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=12;4"

modules-left = powermenu launcher workspaces_pinned quicklaunch
modules-center = xwindow
modules-right = netspeed vpn cpu memory filesystem pulseaudio tray date

cursor-click = pointer
enable-ipc = true

separator = "  "

[module/powermenu]
type = custom/text
; nf-fa-power_off, verified against installed font cmap. Same no-%{T2}
; rule as the other bar icons (clipping risk at the larger font size).
format = <label>
label = "    "
label-foreground = ${colors.urgent}
label-background = ${colors.background-alt}
click-left = ~/.config/rofi/scripts/powermenu.sh &

[module/launcher]
type = custom/text
; nf-fa-th (apps grid icon), verified against installed font cmap.
; No %{T2} here -- same clipping risk the taskbar icons had (icon
; wider than the monospace glyph cell at the larger size gets
; right-clipped).
format = <label>
label = "    Apps  "
label-foreground = ${colors.background}
label-background = ${colors.accent}
click-left = rofi -show drun -config ~/.config/rofi/config.rasi &

[module/workspaces_pinned]
; Fixed, always-visible, independently-clickable buttons for workspaces
; 1-4 -- unlike internal/i3 (which mirrors i3's live workspace list and
; loses empty/unfocused workspaces since i3 auto-destroys them), these
; always show and always work as click targets. Script handles its own
; highlight-the-focused-one logic and live-updates via `i3-msg -t subscribe`.
; Workspaces 5+ are still reachable via Super+5..0, just not pinned here --
; ask if you want more of them pinned too.
type = custom/script
exec = ~/.config/polybar/scripts/workspaces-pinned.sh
tail = true

[module/quicklaunch]
; Pinned quick-launch dock (browser/terminal/Burp/...). Static list, edit
; the APPS array in scripts/quicklaunch.sh to pin more -- no live updates
; needed so this just runs once.
type = custom/script
exec = ~/.config/polybar/scripts/quicklaunch.sh

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.foreground-alt}

[module/netspeed]
type = custom/script
exec = ~/.config/polybar/scripts/netspeed.sh
interval = 2
label = %output%
label-foreground = ${colors.foreground}

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 5
label = %output%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage_used%%
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted = " %percentage_used%%"
label-mounted-foreground = ${colors.foreground}
label-unmounted =

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = " muted"
label-muted-foreground = ${colors.foreground-alt}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol

[module/tray]
type = internal/tray
tray-spacing = 24px
tray-size = 66%
tray-background = ${colors.background}

[module/date]
type = internal/date
interval = 1
date = " %Y-%m-%d"
time = "  %H:%M:%S"
label = %date%  %time%
label-foreground = ${colors.accent}

; ============================================================================
; bar/monobar -- the mono theme's top bar (theme.conf LAYOUT="dock"; launch.sh
; starts this INSTEAD of mainbar). Floating, rounded and outlined, with
; "|"-separated telemetry: date/time left, workspaces centered, status right.
; App launching lives in the right-side dock (~/.config/rice/dock/dock.py)
; instead of quicklaunch/launcher here.
;
; override-redirect: i3 doesn't place it (so offset-x/y actually float it
; off the edges) but also doesn't reserve space for it -- apply-theme.sh
; covers that via i3 gaps + ~/.config/rice/layout.json. Geometry comes from
; layout.ini, generated from theme.conf (EDGE_GAP / TOPBAR_*).
; ============================================================================
[bar/monobar]
width = ${layout.monobar-width}
height = ${layout.monobar-height}
offset-x = ${layout.monobar-offset}
offset-y = ${layout.monobar-offset}
radius = 10
fixed-center = true
override-redirect = true
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}

border-size = ${layout.monobar-border}
border-color = ${colors.accent-alt}
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=12;4"

modules-left = date-mono clock-mono
modules-center = workspaces_pinned
modules-right = pulseaudio battery memory temperature cpu filesystem netspeed vpn network tray power-mono

separator = "|"
separator-foreground = ${colors.foreground-alt}

cursor-click = pointer
enable-ipc = true

[module/date-mono]
type = internal/date
interval = 1
date = "%A  %d %b %Y"
format-prefix = "  "
format-prefix-foreground = ${colors.foreground-alt}
label = %date%
label-foreground = ${colors.foreground}

[module/clock-mono]
type = internal/date
interval = 1
time = "%H:%M:%S"
label = %time%
label-foreground = ${colors.foreground}

[module/battery]
; Polybar disables this module by itself (logged, bar keeps running) on a
; machine without BAT0 -- e.g. this VM -- so it only shows up on a laptop.
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.foreground-alt}
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.foreground-alt}
format-low = <label-low>
format-low-prefix = " "
format-low-foreground = ${colors.urgent}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""
ramp-capacity-foreground = ${colors.foreground-alt}

[module/temperature]
; Same as battery: disabled automatically if thermal_zone0 doesn't exist.
type = internal/temperature
interval = 3
thermal-zone = 0
warn-temperature = 80
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
format-warn = <label-warn>
format-warn-prefix = " "
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/network]
; SSID on wifi, connection name on ethernet (see scripts/network.sh).
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label = %output%
click-left = nm-connection-editor &

[module/power-mono]
type = custom/text
format = <label>
label = "  "
label-foreground = ${colors.foreground}
click-left = ~/.config/rofi/scripts/powermenu.sh &
