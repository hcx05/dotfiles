# TEMPLATE for ~/.config/picom/picom.conf -- edit THIS file for structural
# changes, edit ~/.config/rice/theme.conf for transparency, then re-run
# ~/.config/rice/apply-theme.sh. Do not hand-edit color values here.
#
# backend: xrender chosen deliberately -- this VM uses the VMware SVGA
# virtual GPU, and glx/egl backends are unreliable on it. xrender is
# slower on real hardware but rock solid here.

backend = "xrender";
# vsync off: this VM has no 3D acceleration (Xorg log: "Refusing to try
# glamor on llvmpipe" -- pure software rendering). Present-based vsync is
# unreliable without proper driver/GPU support and is the most common cause
# of compositor flicker/black-flash on unaccelerated VMware SVGA. If you
# later enable "Accelerate 3D graphics" in the VM's hypervisor settings,
# it's safe to flip this back to true.
vsync = false;

# ---- corners -------------------------------------------------------------
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

# ---- shadows: subtle, restrained -----------------------------------------
# radius kept small deliberately -- shadow blur cost scales with radius^2 and
# this is unaccelerated software rendering (see vsync comment above).
# LIGHTWEIGHT PERF OPTION (applied): shadow-exclude also excludes
# window_type='normal', i.e. ordinary tiled app windows never get a shadow
# at all -- only floating dialogs/menus/rofi/dunst do. In a tiling WM most
# of the screen is 'normal' tiled windows, so this removes most of the
# per-frame shadow redraw cost while keeping the effect where it's visible
# (floating windows, launcher, notifications).
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'normal'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
];

# ---- fading: OFF (perf) -----------------------------------------------
# LIGHTWEIGHT PERF OPTION (applied): fading disabled entirely. Each fade
# step is a full recomposite; on unaccelerated xrender that's real CPU cost
# for a purely cosmetic open/close animation. Flip fading back to true (and
# uncomment the steps below) if you get 3D acceleration working and want it
# back -- it's cheap once glamor/GL actually works.
fading = false;
# fade-in-step = 0.06;
# fade-out-step = 0.06;
# fade-delta = 4;

# ---- opacity ----------------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  # kitty intentionally excluded here -- it manages its own background
  # transparency natively (background_opacity in colors.conf). Also
  # forcing picom's window-level opacity on top of that double-applies
  # transparency (kitty's semi-transparent background gets blended again
  # by picom), which is what produced the muddy extra-green haze over the
  # terminal background. Kitty's own opacity is untouched by this.
  "90:class_g = 'Rofi'",
  "88:class_g = 'Polybar'",
  "90:class_g = 'Dunst'",
];

# ---- window animations (視窗動畫) --------------------------------------
# picom 13's built-in animation engine (distinct from the old blur-method
# convolution path that froze the server -- see the note below. This is
# plain scale/opacity compositing, not a blur kernel, and was tested live
# on this VM's unaccelerated xrender backend without issue). Ported from
# gh0stzk's picom-animations.conf: fade+scale on open/close, and a
# spring-ish scale/offset tween on resize/move.
# If this ever turns out to be too heavy on real hardware with many
# windows, delete this whole `animations = (...)` block (or comment it
# out) and reload -- nothing else here depends on it.
animations = (
  {
    triggers = ["close"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.25;
      start = "window-raw-opacity-before";
      end = 0;
    };
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0,1.3,1,1)"; duration = 0.25; start = 1; end = 0.85; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.3;
      start = 0;
      end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0,1.3,1,1)"; duration = 0.3; start = 0.85; end = 1; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },
  {
    triggers = ["size", "position"];
    scale-x = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.35; start = "window-width-before / window-width"; end = 1; };
    scale-y = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.35; start = "window-height-before / window-height"; end = 1; };
    offset-x = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.35; start = "window-x-before - window-x"; end = 0; };
    offset-y = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.35; start = "window-y-before - window-y"; end = 0; };
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  }
);
# Bars/dock/desktop/rofi/dunst should pop instantly, not scale/fade in --
# animating override-redirect bars looks wrong (they'd visibly "grow" on
# every polybar --reload) and rofi/dunst already have their own snappy feel.
animation-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
];

# blur-method is intentionally omitted -- "none" is the default.
#
# TRIED blur-method="gaussian" here once (2026-09-16): froze the entire X
# server solid for ~2 minutes (xdotool/any X client stopped responding) on
# this VM's unaccelerated xrender/software-rendering setup, and two open
# windows were gone by the time it recovered. Do not re-enable gaussian/box/
# kernel blur under this backend without a real GPU (glx/egl) first -- it is
# not just "slow" here, it appears to hang the server outright. The
# animations above were specifically verified NOT to hit the same issue
# before being enabled.

# ---- misc -------------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; };
  dropdown_menu = { opacity = 0.96; };
};
