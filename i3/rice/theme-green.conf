# ============================================================================
# Central color palette for the i3 rice -- Matrix neon-green variant.
#
# Same role/shape as theme-purple.conf, just re-hued. Edit the values below,
# then run:
#   ~/.config/rice/apply-theme.sh
# to regenerate every color file this palette feeds.
#
# CONSUMERS (auto-generated -- do not hand-edit these, edit here instead):
#   ~/.config/i3/config              (color `set` block only, between the
#                                     BEGIN/END GENERATED COLORS markers --
#                                     i3's `include` can't pass variables
#                                     back to the parent file, so this is
#                                     injected in place rather than included)
#   ~/.config/polybar/colors.ini    (polybar [colors] section)
#   ~/.config/rofi/colors.rasi      (rofi rasi variables)
#   ~/.config/kitty/colors.conf     (kitty terminal colors)
#   ~/.config/dunst/dunstrc         (generated in full from dunstrc.template)
#   ~/.config/picom/picom.conf      (generated in full from picom.conf.template,
#                                    opacity/transparency values only)
#
# Hand-authored files that reference the generated fragments above (not
# regenerated, safe to edit directly): i3/config, polybar/config.ini,
# rofi/config.rasi, kitty/kitty.conf.
# ============================================================================

BACKGROUND="#000C02"       # near-black green-black base
BACKGROUND_ALT="#001F0A"   # slightly lighter panel/alt surface

FOREGROUND="#39FF14"       # primary text -- neon Matrix green
FOREGROUND_ALT="#4E9967"   # muted/secondary text (dim green-grey)

ACCENT="#00FF41"           # primary accent -- classic pure "Matrix" green
ACCENT_ALT="#00FFC8"       # secondary accent -- spring green/aqua, green+cyan pairing

BORDER_ACTIVE="#00FF41"    # focused window border / active indicators
BORDER_INACTIVE="#0F3D1F"  # unfocused window border (dark green)

URGENT="#FF1855"           # urgent/alert/critical color -- neon red/magenta (kept
                            # constant across themes so alerts always pop the same way)

TERMINAL_TRANSPARENCY="0.90"  # kitty background alpha, 0.0-1.0 -- terminal only
MENU_TRANSPARENCY="0.90"      # alpha for rofi/dunst/picom popups, 0.0-1.0 -- independent of terminal
BAR_TRANSPARENCY="0.88"    # polybar background alpha, 0.0-1.0

WALLPAPER="$HOME/Pictures/green.png"  # set by wallpaper-selector.sh
