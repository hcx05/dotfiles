# ============================================================================
# Central color palette for the i3 rice -- monochrome (black & white) variant.
#
# Same role/shape as theme-purple.conf / theme-green.conf, plus a different
# LAYOUT: a floating, outlined top bar (bar/monobar) and an Ubuntu-style app
# dock on the right edge (~/.config/rice/dock/dock.py) instead of the
# full-width classic mainbar. Edit the values below, then run:
#   ~/.config/rice/apply-theme.sh
# to regenerate every color/layout file this palette feeds.
#
# CONSUMERS: same list as theme-purple.conf, plus (layout only)
#   ~/.config/polybar/layout.ini    (which bar to launch + its geometry)
#   ~/.config/rice/layout.json      (screen area reserved for the bar/dock --
#                                    read by the maximize/default-size scripts
#                                    and by the dock itself)
#   the GENERATED LAYOUT block in ~/.config/i3/config (gaps for tiled windows)
# ============================================================================

BACKGROUND="#0A0A0A"       # near-black base
BACKGROUND_ALT="#1C1C1C"   # slightly lighter panel/alt surface

FOREGROUND="#E8E8E8"       # primary text (soft white)
FOREGROUND_ALT="#8A8A8A"   # muted/secondary text (mid grey)

ACCENT="#FFFFFF"           # primary accent -- pure white
ACCENT_ALT="#BDBDBD"       # secondary accent -- light grey

BORDER_ACTIVE="#FFFFFF"    # focused window border / active indicators
BORDER_INACTIVE="#2E2E2E"  # unfocused window border (dark grey)

URGENT="#FF1855"           # urgent/alert/critical color -- neon red/magenta (kept
                            # constant across themes so alerts always pop the same way)

TERMINAL_FOREGROUND="#FFFFFF" # kitty text color -- pure white (optional key; other
                               # presets leave it out and use FOREGROUND)
TERMINAL_TRANSPARENCY="0.65"  # kitty background alpha, 0.0-1.0 -- terminal only
TERMINAL_COLOR3="#CFCFCF"     # kitty ANSI yellow / magenta -- optional keys; other
TERMINAL_COLOR5="#9E9E9E"     # presets keep the built-in #E3C878 / #B48EAD
TERMINAL_STYLE="mono"         # tmux status bar look -- optional key,
                              # omitted = "classic" (the purple/green look)
MENU_TRANSPARENCY="0.90"      # alpha for rofi/dunst/picom popups, 0.0-1.0 -- independent of terminal
BAR_TRANSPARENCY="0.88"    # polybar + dock background alpha, 0.0-1.0

WALLPAPER="$HOME/Pictures/mono.png"  # feh wallpaper path, change anytime

# ---- layout (only this preset sets these; omitted = classic layout) ------
LAYOUT="dock"              # "classic" = full-width top bar (purple/green)
                           # "dock"    = floating top bar + right-side app dock
EDGE_GAP="8"               # px between the screen edge and the bar / dock
TOPBAR_HEIGHT="32"         # monobar content height, px
TOPBAR_BORDER="2"          # monobar outline width, px
DOCK_ICON_SIZE="20"        # dock glyph icon size, px -- dock width = this + 12 (32px)
