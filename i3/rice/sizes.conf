# ============================================================================
# Design sizes of the i3 rice -- every pixel-sized thing, in ONE place.
#
# The numbers are what the rice looks like at scale 1.0 (the reference screen
# in scale/scale.conf). Nothing uses them as-is: apply-theme.sh multiplies
# each one by the scale `scale/autoscale` detected for the current screen and
# writes the result into i3 / polybar / dock / dunst / picom. So to change a
# size, change it here -- it then follows every screen proportionally -- and
# run   ~/.config/rice/apply-theme.sh   (or `scale/autoscale apply --force`
# to also reload everything).
#
# Text is not in here on purpose: font sizes are in points in each program's
# own config and follow the DPI autoscale publishes (Xft.dpi).
#
# A theme preset (theme-*.conf) may override any of these; mono does for
# EDGE_GAP / TOPBAR_* / DOCK_*.
# ============================================================================

# ---- i3 windows -----------------------------------------------------------
GAP_INNER=14            # between tiled windows
GAP_OUTER=4             # between tiled windows and the screen edge
BORDER_WIDTH=2          # tiled window border
FLOAT_BORDER_WIDTH=4    # floating window border
WINDOW_MARGIN=4         # kept free around a "maximized" floating window

# ---- polybar --------------------------------------------------------------
MAINBAR_HEIGHT=30       # classic layout's full-width bar
BAR_LINE_SIZE=2         # under/overline thickness
BAR_FONT="JetBrainsMono Nerd Font"
BAR_FONT_SIZE=10        # pt -- text
BAR_FONT_OFFSET=3       # px the text is pushed down to sit centered
BAR_ICON_FONT_SIZE=12   # pt -- %{T2} glyphs
BAR_ICON_FONT_OFFSET=4
TRAY_SPACING=24         # between tray icons

# ---- dock layout (mono): floating top bar + right-side app dock ------------
EDGE_GAP=8              # between the screen edge and the bar / dock
TOPBAR_HEIGHT=32        # monobar content height
TOPBAR_BORDER=2         # monobar outline width
TOPBAR_RADIUS=10        # monobar corner radius
DOCK_ICON_SIZE=20       # dock glyph size
DOCK_LENGTH=1           # dock height as a fraction of the free screen height
                        # (a ratio, not a size -- never scaled)
DOCK_OUTLINE=1          # dock outline width
DOCK_BUTTON_MARGIN=2    # around each dock button
DOCK_ICON_MARGIN=3      # around the glyph inside a button
DOCK_MIN_ICON_SIZE=12   # the dock shrinks its icons down to this when crowded

# ---- notifications (dunst scales its own geometry; these place it) --------
NOTIFY_MARGIN_X=12      # from the screen edge / dock
NOTIFY_MARGIN_Y=10      # below the top bar

# ---- compositor -----------------------------------------------------------
CORNER_RADIUS=6         # rounded window corners
SHADOW_RADIUS=8         # shadow blur radius
SHADOW_OFFSET=-8        # shadow offset (x and y)
