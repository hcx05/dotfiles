# ============================================================================
# autoscale tunables -- how the ONE display scale factor is derived from the
# detected screen. Nothing else in the rice holds a per-resolution number:
# every size is "design size x scale", and the scale comes from here.
#
# After editing:  ~/.config/rice/scale/autoscale apply --force
# See what was detected / decided:  ~/.config/rice/scale/autoscale status
# ============================================================================

# The screen the design sizes (gaps, bar height, font sizes ...) were drawn
# for. A screen with exactly this resolution gets scale 1.0.
REF_WIDTH=1920
REF_HEIGHT=1080

# How strongly the scale follows the resolution when the physical screen
# size is unknown -- always the case inside a VM, where the virtual display
# reports 0mm x 0mm (or made-up numbers):
#   scale = (screen diagonal in px / reference diagonal in px) ^ SCALE_CURVE
#   0    = never scale (fixed pixel sizes: tiny on a big hi-res screen)
#   1    = strictly proportional (same fraction of the screen everywhere:
#          huge on a big screen, cramped on a small one)
#   0.75 = in between: grows on bigger screens, but slower than the pixels do
SCALE_CURVE=0.75

# Personal taste multiplier applied on top of the detected scale. This is
# the knob for "everything a bit bigger/smaller, everywhere" -- e.g. 1.3 if
# the host is a small hi-DPI laptop panel the VM cannot know about.
SCALE_BIAS=1.0

# Never go below / above these, whatever the screen says.
SCALE_MIN=0.8
SCALE_MAX=3.0

# The scale snaps to multiples of this, so dragging the VM window by a few
# pixels does not re-apply the whole rice.
SCALE_STEP=0.05

# Use the physical size (mm) the monitor reports, when there is one?
#   auto = yes on real hardware, no inside a VM (virtual EDIDs lie)
#   yes / no = force
# With a trusted physical size the scale is
#   (real DPI / 96) x (diagonal inches / reference diagonal inches) ^ VIEW_EXP
# -- the second factor because a bigger screen is looked at from further away
# (the reference diagonal is the reference resolution at 96 DPI, ~23").
TRUST_PHYSICAL_SIZE=auto
VIEW_EXP=0.5

# Follow the size of the VM window: when an output's preferred mode changes
# (VMware/VirtualBox/SPICE resize the guest that way) switch to it. A desktop
# environment does this by itself; a bare window manager needs this.
#   auto = only inside a VM (on real hardware a deliberately chosen lower
#          resolution must not be overridden);  yes / no = force
AUTOFIT=auto

# Seconds the resolution has to stay unchanged before a new scale is applied
# (the resolution itself is followed immediately; this only debounces the
# heavier re-apply of bar/gaps/fonts while the window is still being dragged).
SETTLE_SECONDS=1.0

# Safety-net poll interval of `autoscale watch`, for RandR events that never
# arrive. Cheap: one `xrandr --current`.
POLL_SECONDS=5

# X cursor size at scale 1.0 (the X default), scaled like everything else.
CURSOR_SIZE=24
