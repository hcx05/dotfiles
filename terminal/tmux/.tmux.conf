set -g status on
set -g status-position bottom
set -g status-interval 1

# 讓 kitty graphics protocol (例如 fastfetch 的龍圖示) 能穿透 tmux 顯示
set -g allow-passthrough on

set -g status-style bg=black,fg=white

# 關鍵在這兩行
set -g status-right-length 150
set -g status-left-length 20

set -g status-left ""
set -g status-right "#(~/.tmux_status.sh)"

set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# 讓 tmux 進入複製模式時使用 vi 風格按鍵
setw -g mode-keys vi

# 3. 鍵盤選取 (像 nvim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 4. 滑鼠選取完「自動複製」並退出模式
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# 讓 tmux 窗格 (pane) 的切換也跟 Neovim 一樣 (Ctrl + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 插件清單 ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# 這是解決你複製貼上問題的神級插件
set -g @plugin 'tmux-plugins/tmux-yank'

# 讓 tmux-yank 不要自動幫你退出，這樣你選取時才不會跳掉
set -g @yank_with_mouse on                          
set -g @yank_selection_mouse 'clipboard'

set -s escape-time 0

# 5. 手動綁定 y 鍵：複製選取內容並丟給 xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# 6. 手動綁定 Prefix + ]：從 xclip 抓內容回來貼上
bind-key ] run "tmux set-buffer \"$(xclip -selection clipboard -o)\"; tmux paste-buffer"

# --- 初始化 TPM (這行必須放在最下面) ---
run '~/.tmux/plugins/tpm/tpm'
